services:
  - type: web
    name: learnpath-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: DB_PATH
        value: ./learnpath.sqlite

      - key: CORS_ORIGIN
        value: http://localhost:5173

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d
