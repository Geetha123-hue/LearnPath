services:
  - type: web
    name: learnpath-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm rebuild sqlite3 --build-from-source
    startCommand: npm start

    disk:
      name: sqlite_data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: DB_PATH
        value: /var/data/learnpath.sqlite

      - key: CORS_ORIGIN
        value: https://learnpath-snowy.vercel.app,https://learn-path-t5r3-gjr3yqh8-geetha-123.vercel.app

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d
